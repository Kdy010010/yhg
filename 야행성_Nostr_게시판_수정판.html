<section class="main-pane"><div class="board-heading"><div><div class="overline">COMMUNITY / <span id="breadcrumb">자유게시판</span></div><h2 id="boardTitle">☾ 자유게시판</h2><p id="boardDesc">이야기는 자유롭게, 서로에 대한 예의는 지켜주세요.</p></div><button id="composeBtn" class="primary-btn">✎ 글쓰기</button></div><div class="toolbar"><div class="toolbar-left"><button id="newestBtn" class="sort active">최신순</button><span class="count" id="postCount">글 불러오는 중</span></div><button id="reloadBtn" class="icon-btn">↻ 새로고침</button></div><div id="postList" class="post-list"><div class="empty">릴레이에서 게시글을 읽고 있습니다…</div></div><div class="bottom-note">글은 여러 릴레이에 분산 저장됩니다. 릴레이 상태에 따라 게시글 표시와 전달이 달라질 수 있습니다.</div></section></div></main>
<div id="modalRoot"></div><div class="toast" id="toast" role="status"></div>`;

$('#logo').onclick=e=>{e.preventDefault();selected=null;renderPosts()};
$('#settingsBtn').onclick=showSettings;
$('#accountBtn').onclick=showAccount;
$('#composeBtn').onclick=()=>showCompose();
$('#reloadBtn').onclick=()=>loadPosts();
$$('.tab').forEach(b=>b.onclick=()=>{board=b.dataset.board;selected=null;renderBoard();loadPosts()});
function $$(sel,root=document){return [...root.querySelectorAll(sel)]}
function renderBoard(){const b=BOARDS[board];$('#boardTitle').textContent=`${b.emoji} ${b.name}`;$('#breadcrumb').textContent=b.name;$('#boardDesc').textContent=b.desc;$$('.tab').forEach(el=>el.classList.toggle('active',el.dataset.board===board));}
function showModal(html){$('#modalRoot').innerHTML=`<div class="modal-overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};$$('[data-close]').forEach(el=>el.onclick=closeModal)}
function closeModal(){$('#modalRoot').innerHTML=''}
function modalHeader(title,desc=''){return `<div class="modal-head"><div><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div><button type="button" class="close" data-close aria-label="닫기">×</button></div>`}
function updateAccount(){const b=$('#accountBtn');b.textContent=pubkey?`◉ ${shortName(pubkey)}`:'로그인 / 계정 생성';}
async function makeVault(sec,password){const salt=crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt']);const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},aes,sec);return {v:1,salt:hex(salt),iv:hex(iv),data:hex(new Uint8Array(data))};}
async function openVault(v,password){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unhex(v.salt),iterations:250000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unhex(v.iv)},aes,unhex(v.data)));}
const hex = a=>Array.from(a,c=>c.toString(16).padStart(2,'0')).join('');
const unhex = s=>new Uint8Array(s.match(/.{2}/g).map(c=>parseInt(c,16)));
function showAccount(){
 if(pubkey){showModal(`${modalHeader('내 계정','키는 현재 브라우저에서만 복호화됩니다.')}<div class="account-box"><div class="user-icon">N</div><strong>${escapeHTML(shortName(pubkey))}</strong><div class="subtle">${escapeHTML(nip19.npubEncode(pubkey))}</div></div><button class="outline-btn wide" id="copyPub">공개키(npub) 복사</button><div class="warning">비밀키를 분실하면 계정을 복구할 수 없습니다. 계정 생성 시 받은 nsec를 안전하게 보관하세요.</div><button class="danger-outline wide" id="logoutBtn">로그아웃 · 이 기기 키 잠금</button>`);$('#copyPub').onclick=()=>{navigator.clipboard.writeText(nip19.npubEncode(pubkey));toast('공개키가 복사되었습니다')};$('#logoutBtn').onclick=()=>{secret=null;pubkey=null;updateAccount();closeModal();toast('키를 잠갔습니다')};return}
 const vault=localStorage.getItem(KEY_STORAGE);
 showModal(`${modalHeader('Nostr 계정','확장 프로그램 없이 브라우저에서 직접 서명합니다.')}<div class="modal-tabs"><button id="modeCreate" class="active">새 계정</button><button id="modeImport">기존 nsec</button>${vault?'<button id="modeUnlock">저장된 계정</button>':''}</div><div id="accountContents"></div>`);
 const contents=$('#accountContents');const setMode=mode=>{ $$('.modal-tabs button').forEach(b=>b.classList.toggle('active',b.id==='mode'+mode));if(mode==='Create'){contents.innerHTML=`<label>로컬 암호 (8자 이상)</label><input id="pass" type="password" minlength="8" placeholder="기기 안의 키를 암호화할 비밀번호"/><label>암호 확인</label><input id="pass2" type="password" placeholder="비밀번호 다시 입력"/><button class="primary-btn wide" id="createKey">계정 생성</button><p class="hint">비밀키는 이 기기에 AES-GCM 암호화 저장됩니다. 서버로 전송되지 않습니다.</p>`;$('#createKey').onclick=()=>registerKey(generateSecretKey());}
 if(mode==='Import'){contents.innerHTML=`<label>기존 비밀키 (nsec)</label><input id="importNsec" type="password" autocomplete="off" placeholder="nsec1…"/><label>로컬 암호 (8자 이상)</label><input id="pass" type="password" minlength="8" placeholder="이 브라우저에서 사용할 비밀번호"/><label>암호 확인</label><input id="pass2" type="password"/><button class="primary-btn wide" id="createKey">키 가져오기</button><p class="hint">공유 컴퓨터에서는 비밀키를 가져오지 마세요.</p>`;$('#createKey').onclick=()=>{try{const dec=nip19.decode($('#importNsec').value.trim());if(dec.type!=='nsec')throw Error();registerKey(dec.data)}catch{toast('올바른 nsec 키를 입력하세요',true)}};}
 if(mode==='Unlock'){contents.innerHTML=`<label>로컬 암호</label><input id="unlockPass" type="password" placeholder="계정 생성 시 입력한 비밀번호"/><button class="primary-btn wide" id="unlockKey">잠금 해제</button>`;$('#unlockKey').onclick=async()=>{try{const sec=await openVault(JSON.parse(localStorage.getItem(KEY_STORAGE)),$('#unlockPass').value);secret=sec;pubkey=getPublicKey(secret);updateAccount();closeModal();toast('로그인되었습니다')}catch{toast('비밀번호가 일치하지 않습니다',true)}};}
 };['Create','Import','Unlock'].forEach(m=>{const el=$('#mode'+m);if(el)el.onclick=()=>setMode(m)});setMode(vault?'Unlock':'Create');
 async function registerKey(sk){const password=$('#pass').value;if(password.length<8||password!==$('#pass2').value){toast('암호 8자 이상, 암호 확인이 일치해야 합니다',true);return}if(localStorage.getItem(KEY_STORAGE)&&!confirm('이 기기에 저장된 기존 계정을 새 키로 덮어씁니다. 기존 키를 백업했나요?'))return;const nsec=nip19.nsecEncode(sk);const encrypted=await makeVault(sk,password);localStorage.setItem(KEY_STORAGE,JSON.stringify(encrypted));secret=sk;pubkey=getPublicKey(sk);updateAccount();showModal(`${modalHeader('계정 생성 완료','아래 비밀키를 반드시 안전한 곳에 백업하세요.')}<div class="warning"><strong>⚠ 비밀키는 단 한 번만 보여드립니다.</strong><p>이 키를 잃어버리면 다른 기기에서 계정을 복구할 수 없습니다. 다른 사람에게 공개하지 마세요.</p></div><textarea class="nsec-backup" readonly id="backupNsec">${escapeHTML(nsec)}</textarea><button class="outline-btn wide" id="copyNsec">비밀키 복사</button><button class="primary-btn wide" data-close>백업을 완료했습니다</button>`);$('#copyNsec').onclick=()=>{navigator.clipboard.writeText(nsec);toast('비밀키가 복사되었습니다. 안전한 곳에 보관하세요')};$$('[data-close]').forEach(el=>el.onclick=closeModal);}
}
function showSettings(){showModal(`${modalHeader('릴레이 설정','모든 사용자에게 동일한 릴레이 목록을 권장합니다.')}<label>릴레이 주소 (줄마다 하나씩, 최대 8개)</label><textarea id="relayInput" rows="6">${escapeHTML(relays.join('\n'))}</textarea><p class="hint">wss:// 주소만 허용됩니다. 목록을 변경하면 다른 사용자와 보이는 글이 달라질 수 있습니다.</p><button id="saveRelays" class="primary-btn wide">저장하고 다시 불러오기</button><div class="warning">게시글은 암호화되지 않으며 릴레이 운영자나 제3자가 조회할 수 있습니다. 개인정보를 올리지 마세요.</div>`);$('#saveRelays').onclick=()=>{const items=[...new Set($('#relayInput').value.split(/\s+/).map(x=>x.trim()).filter(Boolean))];if(!items.length||items.length>8||items.some(x=>!/^wss:\/\/[\w.-]+(?::\d+)?(?:\/[^\s]*)?$/i.test(x))){toast('유효한 wss:// 릴레이 1~8개를 입력하세요',true);return}relays=items;localStorage.setItem(RELAY_STORAGE,JSON.stringify(items));closeModal();loadPosts()};}
async function fetchBoard(){let reachable=0;const filter={kinds:[KIND],'#t':[boardTag(board)],limit:350};const jobs=relays.map(async relay=>{try{const events=await Promise.race([pool.querySync([relay],filter),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),7000))]);reachable++;return events}catch{return []}});const gathered=(await Promise.all(jobs)).flat();if(reachable===0)throw Error('설정된 모든 릴레이에 연결하지 못했습니다. 설정에서 릴레이 주소를 확인하세요.');const unique=new Map();for(const ev of gathered){if(ev.kind!==KIND||!ev.tags.some(t=>t[0]==='t'&&t[1]===boardTag(board))||!verifyEvent(ev))continue;const p=parsePayload(ev);if(!p||!['post','reply'].includes(p.type)||!postId(ev))continue;const old=unique.get(`${ev.pubkey}:${postId(ev)}`);if(!old||ev.created_at>old.created_at)unique.set(`${ev.pubkey}:${postId(ev)}`,ev)}return [...unique.values()];}
async function loadPosts(){if(busy){return;}busy=true;$('#postCount').textContent='릴레이 확인 중…';$('#statusDot').classList.remove('live');const current=board;try{const evs=await fetchBoard();if(current!==board){setTimeout(loadPosts,0);return;}posts=evs;$('#statusDot').classList.add('live');$('#relayStatus').textContent='릴레이 연결됨';renderPosts()}catch(e){toast(`불러오기 실패: ${e.message}`,true);$('#relayStatus').textContent='릴레이 연결 실패';$('#postCount').textContent='릴레이 연결 실패'}finally{busy=false}}
function card(e){const p=parsePayload(e),replyCount=posts.filter(x=>parsePayload(x)?.type==='reply'&&parsePayload(x)?.replyTo===coord(e)).length;const imgs=[...new Set([...p.images,...extractImages(p.body)])];return `<article class="post-card" data-post="${escapeHTML(postId(e))}" data-author="${escapeHTML(e.pubkey)}"><div class="post-meta"><span class="avatar">${e.pubkey.slice(0,2).toUpperCase()}</span><span class="author">${escapeHTML(shortName(e.pubkey))}</span><span class="middle-dot">·</span><time>${formatTime(e.created_at)}</time></div><h3>${escapeHTML(p.title||'제목 없음')}</h3><p class="excerpt">${escapeHTML(p.body.slice(0,250))}</p>${imgs.length?`<div class="image-strip">${imgs.slice(0,3).map(url=>`<img loading="lazy" src="${escapeHTML(url)}" alt="첨부 이미지" referrerpolicy="no-referrer"/>`).join('')}</div>`:''}<div class="post-bottom"><span>♧ 댓글 ${replyCount}</span><span class="read-more">글 보기 →</span></div></article>`}
function renderPosts(){const els=posts.filter(e=>parsePayload(e)?.type==='post').sort((a,b)=>b.created_at-a.created_at);$('#postCount').textContent=`게시글 ${els.length}개`;$('#postList').innerHTML=els.length?els.map(card).join(''):'<div class="empty"><div class="empty-icon">✳</div><h3>아직 게시글이 없어요</h3><p>이 게시판의 첫 글을 남겨보세요.</p></div>';$$('[data-post]').forEach(el=>el.onclick=()=>openPost(posts.find(p=>postId(p)===el.dataset.post&&p.pubkey===el.dataset.author)));}
function showCompose(replyTo=null){if(!replyTo || !Array.isArray(replyTo.tags) || typeof replyTo.pubkey !== 'string')replyTo=null;if(!secret){toast('먼저 Nostr 계정을 생성하거나 로그인하세요');showAccount();return}draftImages=[];const replying=!!replyTo;showModal(`${modalHeader(replying?'댓글 작성':`${BOARDS[board].name}에 글쓰기`,'확장 프로그램 없이 Nostr 이벤트로 발행됩니다.')}<form id="writeForm">${replying?'':`<label for="titleInput">제목</label><input id="titleInput" maxlength="120" required placeholder="제목을 입력하세요"/>`}<label for="bodyInput">${replying?'댓글':'내용'}</label><textarea id="bodyInput" rows="7" maxlength="15000" required placeholder="이야기를 자유롭게 작성하세요."></textarea><div class="image-header"><label>짤방 / 이미지</label><a href="https://postimages.org/ko/" target="_blank" rel="noopener noreferrer" class="postimages-link">↗ Postimages 업로드</a></div><div class="image-help">Postimages에서 업로드 후 <b>직접 링크(Direct link)</b>를 복사해서 아래에 붙여넣으세요. 파일은 Postimages에, 글에는 URL만 저장됩니다.</div><div class="add-url"><input type="url" id="imageUrl" placeholder="https://i.postimg.cc/…/image.jpg"/><button type="button" class="outline-btn" id="addImage">이미지 추가</button></div><div class="draft-images" id="draftImages"></div><div class="form-bottom"><span>📡 kind ${KIND} · ${escapeHTML(board)}</span><button class="primary-btn" id="submitPost" type="submit">${replying?'댓글 등록':'게시글 등록'}</button></div></form>`);
 $('#addImage').onclick=()=>{const link=$('#imageUrl').value.trim();if(!validImageUrl(link)){toast('Postimages의 직접 이미지 링크를 넣어주세요',true);return}if(draftImages.length>=12){toast('이미지는 최대 12장까지 추가할 수 있습니다',true);return}if(!draftImages.includes(link))draftImages.push(link);$('#imageUrl').value='';renderDraftImages()};
 function renderDraftImages(){$('#draftImages').innerHTML=draftImages.map((u,i)=>`<div class="draft-img"><img src="${escapeHTML(u)}" alt="첨부 이미지" referrerpolicy="no-referrer"/><button type="button" data-remove="${i}" aria-label="이미지 삭제">×</button></div>`).join('');$$('[data-remove]').forEach(b=>b.onclick=()=>{draftImages.splice(Number(b.dataset.remove),1);renderDraftImages()})}
 $('#writeForm').onsubmit=async e=>{e.preventDefault();const body=$('#bodyInput').value.trim(),title=replying?'':$('#titleInput').value.trim();if(!body||(!replying&&!title))return;const submit=$('#submitPost');submit.disabled=true;submit.textContent='릴레이에 발행 중…';const payload={v:1,type:replying?'reply':'post',title,body,images:draftImages,replyTo:replying?coord(replyTo):''};const tags=[['d',uid()],['t',boardTag(board)],['client','yaheng-board']];if(replying)tags.push(['a',coord(replyTo)]);try{const ev=finalizeEvent({kind:KIND,created_at:now(),tags,content:JSON.stringify(payload)},secret);const results=await Promise.allSettled(relays.map(async relay=>{await Promise.race([Promise.resolve(pool.publish([relay],ev)[0]),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),9000))]);return relay}));const success=results.filter(x=>x.status==='fulfilled').length;if(!success)throw new Error('릴레이가 발행을 수락하지 않았습니다. 다른 릴레이를 설정하거나 다시 시도하세요.');posts.unshift(ev);closeModal();toast(`${success}/${relays.length}개 릴레이에 발행했습니다`);renderPosts();if(replying)openPost(replyTo);setTimeout(loadPosts,900);}catch(err){toast(err.message,true);submit.disabled=false;submit.textContent=replying?'댓글 등록':'게시글 등록'}};
}
function openPost(e){if(!e)return;const p=parsePayload(e);const images=[...new Set([...p.images,...extractImages(p.body)])];const replies=posts.filter(x=>parsePayload(x)?.type==='reply'&&parsePayload(x)?.replyTo===coord(e)).sort((a,b)=>a.created_at-b.created_at);showModal(`${modalHeader(escapeHTML(p.title||'게시글'))}<div class="post-meta"><span class="avatar">${e.pubkey.slice(0,2).toUpperCase()}</span><span class="author">${escapeHTML(shortName(e.pubkey))}</span><time>${formatTime(e.created_at)}</time></div><div class="full-body">${escapeHTML(p.body)}</div>${images.length?`<div class="full-images">${images.map(u=>`<a href="${escapeHTML(u)}" target="_blank" rel="noopener noreferrer"><img src="${escapeHTML(u)}" alt="게시물 이미지" loading="lazy" referrerpolicy="no-referrer"/></a>`).join('')}</div>`:''}<div class="thread-head"><strong>댓글 ${replies.length}</strong><button class="outline-btn" id="replyBtn">+ 댓글 달기</button></div><div class="reply-list">${replies.length?replies.map(x=>`<div class="reply"><div class="post-meta"><b>${escapeHTML(shortName(x.pubkey))}</b><time>${formatTime(x.created_at)}</time></div><div>${escapeHTML(parsePayload(x).body)}</div>${parsePayload(x).images.map(u=>`<img class="reply-image" src="${escapeHTML(u)}" loading="lazy" alt="댓글 이미지"/>`).join('')}</div>`).join(''):'<p class="reply-empty">아직 댓글이 없습니다.</p>'}</div><div class="post-id">Nostr 좌표: ${escapeHTML(coord(e))}</div>`);$('#replyBtn').onclick=()=>showCompose(e)}
renderBoard();updateAccount();loadPosts();refreshTimer=setInterval(()=>{if(!$('#overlay')&&!document.hidden)loadPosts()},45000);

</script>
